<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset Admin Password | Muhammad Talha Nasar</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#03050c;color:#e5e7eb;font-family:Arial,sans-serif}
    .card{width:100%;max-width:430px;padding:30px;background:#070b19;border:1px solid #263044;border-radius:16px;box-shadow:0 20px 60px #0008}
    .eyebrow{color:#d4af37;font-size:12px;letter-spacing:3px;text-transform:uppercase}h1{font-size:25px;margin:10px 0 8px}p{color:#aab2c2;line-height:1.5;font-size:14px}
    label{display:block;margin:18px 0 7px;font-size:13px}input{width:100%;padding:13px;border:1px solid #344055;border-radius:8px;background:#0d1424;color:white;font-size:15px}
    button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:8px;background:#d4af37;color:#080808;font-weight:bold;font-size:15px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    #message{margin-top:16px;min-height:20px}.error{color:#fca5a5!important}.success{color:#86efac!important}.hidden{display:none}
  </style>
</head>
<body>
  <main class="card">
    <div class="eyebrow">Private control panel</div>
    <h1>Set a new password</h1>
    <p>Enter your new admin password below. Use at least 8 characters.</p>
    <form id="resetForm" class="hidden">
      <label for="password">New password</label>
      <input id="password" type="password" minlength="8" autocomplete="new-password" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Update password</button>
    </form>
    <p id="message">Checking your recovery link…</p>
  </main>
<script>
(async function(){
  const message=document.getElementById('message');
  const form=document.getElementById('resetForm');
  const button=document.getElementById('submitButton');
  const config=window.SUPABASE_CONFIG;
  if(!config||!config.url||!config.anonKey){message.textContent='Supabase configuration was not found. Make sure supabase-config.js is uploaded beside this file.';message.className='error';return;}
  const client=window.supabase.createClient(config.url,config.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  try{
    const url=new URL(window.location.href);
    const hash=new URLSearchParams(url.hash.replace(/^#/,'').replace(/^\//,''));
    const query=url.searchParams;
    if(query.get('error')||hash.get('error')) throw new Error(query.get('error_description')||hash.get('error_description')||'This recovery link is invalid or has expired.');
    let sessionResult=await client.auth.getSession();
    if(!sessionResult.data.session){
      const tokenHash=query.get('token_hash');
      const type=query.get('type')||hash.get('type');
      if(tokenHash&&type==='recovery'){
        const verified=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
        if(verified.error) throw verified.error;
        sessionResult=await client.auth.getSession();
      }
    }
    if(!sessionResult.data.session) throw new Error('The recovery link is missing or expired. Please request a new password recovery email.');
    form.classList.remove('hidden');
    message.textContent='Recovery link verified. Choose your new password.';
  }catch(error){message.textContent=error.message||'Could not verify the recovery link. Request a new one.';message.className='error';}
  form.addEventListener('submit',async function(event){
    event.preventDefault();
    const password=document.getElementById('password').value;
    const confirm=document.getElementById('confirmPassword').value;
    if(password.length<8){message.textContent='Password must be at least 8 characters.';message.className='error';return;}
    if(password!==confirm){message.textContent='The passwords do not match.';message.className='error';return;}
    button.disabled=true;button.textContent='Updating…';
    const result=await client.auth.updateUser({password});
    if(result.error){message.textContent=result.error.message;message.className='error';button.disabled=false;button.textContent='Update password';return;}
    message.className='success';message.textContent='Your password has been updated successfully. You can now sign in to the admin panel.';
    form.classList.add('hidden');
    const link=document.createElement('a');link.href='admin.html';link.textContent='Go to Admin Sign In';link.style='display:block;margin-top:20px;color:#d4af37;text-align:center';document.querySelector('.card').appendChild(link);
  });
})();
</script>
</body>
</html>
